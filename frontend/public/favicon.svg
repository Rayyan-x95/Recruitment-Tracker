<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Icon Primary Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#primaryGrad)" stroke-width="8" stroke-opacity="0.3" />

  <!-- Stylized Briefcase Body -->
  <rect x="96" y="176" width="320" height="240" rx="36" fill="url(#primaryGrad)" filter="url(#glow)" />
  
  <!-- Briefcase Handle -->
  <path d="M192 176 V144 C192 126.327 206.327 112 224 112 H288 C305.673 112 320 126.327 320 144 V176" fill="none" stroke="url(#primaryGrad)" stroke-width="28" stroke-linecap="round" />

  <!-- Candidate Silhouette inside Briefcase -->
  <circle cx="256" cy="248" r="44" fill="#ffffff" />
  <path d="M184 352 C184 308 216 296 256 296 C296 296 328 308 328 352" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />

  <!-- Success Checkmark Badge -->
  <circle cx="368" cy="368" r="56" fill="#0f172a" stroke="#1e1b4b" stroke-width="8" />
  <circle cx="368" cy="368" r="46" fill="url(#accentGrad)" />
  <path d="M344 368 L360 384 L392 352" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
</svg>