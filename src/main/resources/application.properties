# Server Configuration
server.port=8080

# Application Name
spring.application.name=Recruitment Tracker

# ===================================================================
# DATABASE CONFIGURATION
# ===================================================================
# DEFAULT: Embedded H2 Database (In-Memory with MySQL Compatibility Mode for Zero-Setup Local Execution)
spring.datasource.url=jdbc:h2:mem:rectrackerdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Access via http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Defer SQL Data Initialization until Hibernate creates table schemas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# ===================================================================
# UNCOMMENT BELOW FOR PRODUCTION MYSQL DATABASE CONNECTION
# ===================================================================
