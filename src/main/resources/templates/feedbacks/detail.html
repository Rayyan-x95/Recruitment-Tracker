<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Evaluation Feedback Detail')}"></head>
<body>

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div class="container py-4" style="max-width: 800px;">

        <div class="mb-3">
            <a th:href="@{/feedbacks}" class="text-decoration-none text-muted fw-semibold">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Feedbacks List
            </a>
        </div>

        <div class="card card-custom" th:if="${feedback != null}">
            <div class="card-header card-header-custom">
                <span>Evaluation Record <strong th:text="'#' + ${feedback.id}">#1</strong></span>
                <span class="badge"
                      th:classappend="${feedback.overallRecommendation == 'STRONG_HIRE' or feedback.overallRecommendation == 'HIRE'} ? 'bg-success text-white' : (${feedback.overallRecommendation == 'HOLD'} ? 'bg-warning text-dark' : 'bg-danger text-white')"
                      th:text="${feedback.overallRecommendation}">RECOMMENDATION</span>
            </div>

            <div class="card-body p-4">

                <div class="row mb-4 text-center">
                    <div class="col-md-4">
                        <div class="p-3 bg-light rounded-3">
                            <small class="text-muted text-uppercase fw-bold d-block mb-1">Technical Skills</small>
                            <span class="fs-4 fw-extrabold text-primary" th:text="${feedback.technicalRating} + ' / 5'">5/5</span>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="p-3 bg-light rounded-3">
                            <small class="text-muted text-uppercase fw-bold d-block mb-1">Communication</small>
                            <span class="fs-4 fw-extrabold text-primary" th:text="${feedback.communicationRating} + ' / 5'">5/5</span>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="p-3 bg-light rounded-3">
                            <small class="text-muted text-uppercase fw-bold d-block mb-1">Problem Solving</small>
                            <span class="fs-4 fw-extrabold text-primary" th:text="${feedback.problemSolvingRating} + ' / 5'">5/5</span>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <h6 class="fw-bold text-dark mb-2">Evaluator / Interviewer</h6>
                    <p class="text-secondary" th:text="${feedback.interviewerName}">Interviewer</p>
                </div>

                <div class="mb-4">
                    <h6 class="fw-bold text-dark mb-2">Detailed Notes & Feedback</h6>
                    <div class="p-3 bg-light rounded-3 border">
                        <p class="mb-0 text-dark" th:text="${feedback.comments != null and !feedback.comments.isBlank() ? feedback.comments : 'No additional comments recorded.'}">Comments</p>
                    </div>
                </div>

                <div class="text-end">
                    <a th:href="@{/candidates/{id}(id=${feedback.candidateId})}" class="btn btn-outline-primary">
                        <i class="fa-solid fa-user me-1"></i> View Candidate Profile
                    </a>
                </div>
            </div>
        </div>

        <div th:if="${feedback == null}" class="card card-custom p-5 text-center text-muted">
            <i class="fa-solid fa-file-circle-question fs-1 mb-3 text-secondary"></i>
            <h5>No feedback submitted for this interview yet.</h5>
            <div class="mt-3">
                <a th:href="@{/feedbacks/new(interviewId=${interviewId})}" class="btn btn-primary-custom">
                    <i class="fa-solid fa-pen-to-square me-1"></i> Submit Feedback Now
                </a>
            </div>
        </div>

    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
