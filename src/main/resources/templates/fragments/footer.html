<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<footer th:fragment="footer" class="footer-minimal mt-auto border-top bg-white py-4">
    <div class="container-fluid px-lg-4">
        <div class="row align-items-center gy-3">
            <!-- Left: Brand & Status -->
            <div className="col-md-6 d-flex flex-wrap align-items-center gap-3">
                <div className="d-flex align-items-center gap-2">
                    <div className="brand-icon-sm">
                        <i className="fa-solid fa-layer-group"></i>
                    </div>
                    <span className="fw-bold text-dark fs-6">RecTracker</span>
                </div>
                <span className="text-muted d-none d-sm-inline">|</span>
                <div className="d-flex align-items-center gap-2 text-muted small">
                    <span className="status-dot-green"></span>
                    <span>All Systems Operational</span>
                </div>
            </div>

            <!-- Right: Technical Specs & Copyright -->
            <div className="col-md-6 text-md-end text-muted small">
                <div className="d-flex flex-wrap align-items-center justify-content-md-end gap-3 mb-1">
                    <a th:href="@{/h2-console}" target="_blank" class="footer-link">H2 Console</a>
                    <span>•</span>
                    <a th:href="@{/api/candidates}" target="_blank" class="footer-link">REST Endpoints</a>
                    <span>•</span>
                    <span className="text-secondary fw-semibold">Spring Boot & MySQL</span>
                </div>
                <p className="mb-0 text-secondary" style="font-size: 0.78rem;">
                    &copy; 2026 Recruitment Tracker Platform. All rights reserved.
                </p>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Application JS -->
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/analytics-charts.js}"></script>
</footer>
</html>
