<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="navbar" class="navbar-sticky-wrapper">
    <nav class="navbar navbar-expand-lg navbar-minimal">
        <div class="container-fluid px-lg-4">
            <!-- Brand -->
            <a class="navbar-brand-minimal me-lg-4" th:href="@{/dashboard}">
                <div class="brand-icon-sq">
                    <i className="fa-solid fa-layer-group"></i>
                </div>
                <span className="brand-text">RecTracker</span>
                <span className="brand-badge">Enterprise</span>
            </a>

            <!-- Mobile Toggler -->
            <button 
                className="navbar-toggler border-0 shadow-none px-2" 
                type="button" 
                data-bs-toggle="collapse" 
                data-bs-target="#navbarMain"
            >
                <i className="fa-solid fa-bars-staggered text-secondary fs-5"></i>
            </button>

            <!-- Navigation Links -->
            <div className="collapse navbar-collapse" id="navbarMain">
                <ul className="navbar-nav me-auto mb-2 mb-lg-0 nav-pills-minimal gap-lg-1">
                    <li className="nav-item">
                        <a className="nav-link-minimal" th:href="@{/dashboard}">
                            <i className="fa-solid fa-chart-pie me-2"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li className="nav-item">
                        <a className="nav-link-minimal" th:href="@{/candidates}">
                            <i className="fa-solid fa-user-group me-2"></i>
                            <span>Candidates</span>
                        </a>
                    </li>
                    <li className="nav-item">
                        <a className="nav-link-minimal" th:href="@{/interviews}">
                            <i className="fa-solid fa-calendar-alt me-2"></i>
                            <span>Interviews</span>
                        </a>
                    </li>
                    <li className="nav-item">
                        <a className="nav-link-minimal" th:href="@{/feedbacks}">
                            <i className="fa-solid fa-clipboard-check me-2"></i>
                            <span>Feedbacks</span>
                        </a>
                    </li>
                    <li className="nav-item">
                        <a className="nav-link-minimal" th:href="@{/offers}">
                            <i className="fa-solid fa-file-contract me-2"></i>
                            <span>Offers</span>
                        </a>
                    </li>
                </ul>

                <!-- Right User Actions -->
                <div className="d-flex align-items-center gap-3 pt-2 pt-lg-0" th:if="${session.loggedUser != null}">
                    <div className="dropdown">
                        <button 
                            className="btn user-profile-btn dropdown-toggle d-flex align-items-center gap-2" 
                            type="button" 
                            data-bs-toggle="dropdown"
                        >
                            <div className="avatar-circle">
                                <span th:text="${#strings.substring(session.loggedUser.fullName, 0, 1)}">U</span>
                            </div>
                            <div className="d-none d-sm-flex flex-column text-start lh-1">
                                <span className="user-name-text" th:text="${session.loggedUser.fullName}">User</span>
                                <span className="user-role-sub" th:text="${session.loggedUser.role}">ADMIN</span>
                            </div>
                            <i className="fa-solid fa-chevron-down text-muted fs-xs ms-1"></i>
                        </button>

                        <ul className="dropdown-menu dropdown-menu-end dropdown-menu-minimal shadow-sm border mt-2">
                            <li className="px-3 py-2 border-bottom bg-light-subtle">
                                <p className="fw-semibold mb-0 text-dark small" th:text="${session.loggedUser.fullName}">User</p>
                                <p className="text-muted mb-0 small text-truncate" th:text="${session.loggedUser.email}">email@example.com</p>
                            </li>
                            <li>
                                <a className="dropdown-item py-2 small d-flex align-items-center gap-2" th:href="@{/h2-console}" target="_blank">
                                    <i className="fa-solid fa-database text-muted"></i>
                                    <span>H2 Database Console</span>
                                </a>
                            </li>
                            <li><hr className="dropdown-divider my-1"></li>
                            <li>
                                <a className="dropdown-item py-2 small text-danger d-flex align-items-center gap-2" th:href="@{/logout}">
                                    <i className="fa-solid fa-arrow-right-from-bracket"></i>
                                    <span>Sign Out</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>

                <div className="d-flex gap-2" th:if="${session.loggedUser == null}">
                    <a th:href="@{/login}" class="btn btn-outline-secondary btn-sm px-3 fw-semibold rounded-pill">Login</a>
                    <a th:href="@{/register}" class="btn btn-primary-custom btn-sm px-3 fw-semibold rounded-pill">Register</a>
                </div>
            </div>
        </div>
    </nav>
</header>
</html>
