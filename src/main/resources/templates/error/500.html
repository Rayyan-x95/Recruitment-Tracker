<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('500 - Server Error')}"></head>
<body class="bg-light">

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div class="container py-5 text-center" style="max-width: 600px;">
        <div class="card card-custom p-5">
            <h1 class="display-1 fw-extrabold text-danger mb-3">500</h1>
            <h3 class="fw-bold mb-3">System Processing Exception</h3>
            <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'An unexpected error occurred while processing your request. Please check input parameters or try again.'}">Server Error</p>
            <div>
                <a th:href="@{/dashboard}" class="btn btn-primary-custom px-4 py-2">
                    <i class="fa-solid fa-house me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
