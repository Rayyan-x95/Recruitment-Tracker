<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('404 - Page Not Found')}"></head>
<body class="bg-light">

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div class="container py-5 text-center" style="max-width: 600px;">
        <div class="card card-custom p-5">
            <h1 class="display-1 fw-extrabold text-primary mb-3">404</h1>
            <h3 class="fw-bold mb-3">Requested Resource Not Found</h3>
            <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'The candidate, interview, or page record you are looking for does not exist or has been moved.'}">Resource not found</p>
            <div>
                <a th:href="@{/dashboard}" class="btn btn-primary-custom px-4 py-2">
                    <i class="fa-solid fa-house me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
